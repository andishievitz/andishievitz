<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5D73"/></marker></defs><rect width="1100" height="600" fill="#ffffff" stroke="#D5DBE3" stroke-width="2"/><rect width="1100" height="5" fill="#002B51"/><text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#002B51">80 squares, 157 hours, 13 statistical analyses: what I found</text><text x="40" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A"></text><rect x="40" y="95" width="325" height="215" fill="#F4F6F9"/><rect x="40" y="95" width="325" height="4" fill="#002B51"/><text x="68" y="167" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#002B51">1h 58m</text><text x="68" y="207" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D">Average time per square</text><text x="68" y="241" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">vs. a 90-minute benchmark (t-test,</text><text x="68" y="263" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">p &lt; 0.001)</text><rect x="385" y="95" width="325" height="215" fill="#F4F6F9"/><rect x="385" y="95" width="325" height="4" fill="#187ABA"/><text x="413" y="167" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#187ABA">+52 min</text><text x="413" y="207" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D">Diagonal vs. horizontal squares</text><text x="413" y="241" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">two-sample t-test (p &lt; 0.001)</text><rect x="730" y="95" width="325" height="215" fill="#F4F6F9"/><rect x="730" y="95" width="325" height="4" fill="#4A5D73"/><text x="758" y="167" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#4A5D73">Stitches</text><text x="758" y="207" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D">Best predict time</text><text x="758" y="241" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">multiple regression: # of stitches</text><text x="758" y="263" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">p &lt; 0.001</text><rect x="40" y="330" width="325" height="215" fill="#F4F6F9"/><rect x="40" y="330" width="325" height="4" fill="#187ABA"/><text x="68" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#187ABA">Yarn brand</text><text x="68" y="442" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D">Changes finished size</text><text x="68" y="476" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">ANOVA (p &lt; 0.001); time didn't</text><text x="68" y="498" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">predict size (R² = 0.7%)</text><rect x="385" y="330" width="325" height="215" fill="#F4F6F9"/><rect x="385" y="330" width="325" height="4" fill="#4A5D73"/><text x="413" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#4A5D73">83% vs 53%</text><text x="413" y="442" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D">Solid vs. striped rated 'pretty'</text><text x="413" y="476" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F6B7A">two-way chi-square (p = 0.004)</text><rect x="730" y="330" width="325" height="215" fill="#F4F6F9"/><rect x="730" y="330" width="325" height="4" fill="#002B51"/><text x="758" y="402" font-famil